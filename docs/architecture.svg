<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 775" width="1280" height="775"
     font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Architecture de l'assistant factures (RAG)</title>
  <defs>
    <marker id="fleche" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .titre   { font-size: 24px; font-weight: 700; fill: #0f172a; }
      .intro   { font-size: 14px; fill: #475569; }
      .section { font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em; fill: #475569; }
      .ambre   { fill: #b45309; }
      .t       { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .s       { font-size: 12.5px; fill: #334155; }
      .f       { font-size: 11.5px; fill: #64748b; font-family: ui-monospace, Menlo, Consolas, monospace; }
      .note    { font-size: 12px; fill: #475569; }
      .bande   { fill: #f8fafc; }
      .boite   { stroke-width: 1.5; }
      .donnee  { fill: #eef4ff; stroke: #3b6fd9; }
      .code    { fill: #ffffff; stroke: #94a3b8; }
      .pers    { fill: #f1f5f9; stroke: #94a3b8; }
      .externe { fill: #fff5e6; stroke: #d97706; stroke-dasharray: 6 4; }
      .lien    { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#fleche); }
      .double  { marker-start: url(#fleche); }
      .pastille      { fill: #0f172a; }
      .pastille-txt  { font-size: 12px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1280" height="775" fill="#ffffff"/>

  <text class="titre" x="40" y="42">Assistant factures (RAG) : architecture</text>
  <text class="intro" x="40" y="64">Deux temps : on prépare les documents une fois, puis on répond aux questions.</text>

  <!-- ===================== 1. PRÉPARATION ===================== -->
  <rect class="bande" x="20" y="76" width="1240" height="160" rx="14"/>
  <text class="section" x="40" y="100">1 · PRÉPARATION, UNE SEULE FOIS</text>

  <rect class="boite donnee" x="40" y="120" width="230" height="100" rx="10"/>
  <text class="t" x="56" y="148">Documents PDF</text>
  <text class="s" x="56" y="170">30 factures fictives, 2 clients</text>
  <text class="s" x="56" y="188">2 textes officiels (DGFiP)</text>

  <rect class="boite code" x="330" y="120" width="300" height="100" rx="10"/>
  <text class="t" x="346" y="148">Ingestion</text>
  <text class="s" x="346" y="170">lecture, découpage en passages,</text>
  <text class="s" x="346" y="188">vecteurs calculés en local</text>
  <text class="f" x="346" y="208">app/ingestion.py</text>

  <rect class="boite donnee" x="700" y="120" width="250" height="100" rx="10"/>
  <text class="t" x="716" y="148">Base vectorielle Chroma</text>
  <text class="s" x="716" y="170">135 passages et leurs vecteurs</text>
  <text class="s" x="716" y="188">étiquette « client » sur chacun</text>
  <text class="f" x="716" y="208">data/chroma/</text>

  <rect class="boite donnee" x="990" y="120" width="250" height="100" rx="10"/>
  <text class="t" x="1006" y="148">Tableau des montants</text>
  <text class="s" x="1006" y="170">une ligne par facture</text>
  <text class="f" x="1006" y="208">data/montants.csv</text>

  <path class="lien" d="M270,170 L328,170"/>
  <path class="lien" d="M630,170 L698,170"/>
  <path class="lien" d="M560,120 L560,96 L1115,96 L1115,118"/>
  <text class="note" x="838" y="90" text-anchor="middle">totaux de chaque facture</text>

  <!-- liens entre les deux temps -->
  <text class="note" x="855" y="257">interroge</text>
  <text class="note" x="1125" y="257">lit</text>

  <!-- ===================== 2. QUESTION ===================== -->
  <rect class="bande" x="20" y="268" width="1240" height="456" rx="14"/>
  <text class="section" x="40" y="294">2 · QUESTION, À CHAQUE REQUÊTE</text>

  <rect class="boite pers" x="40" y="460" width="160" height="90" rx="10"/>
  <text class="t" x="56" y="487">Utilisateur</text>
  <text class="s" x="56" y="508">choisit un client,</text>
  <text class="s" x="56" y="526">pose une question</text>

  <rect class="boite code" x="290" y="460" width="170" height="90" rx="10"/>
  <text class="t" x="306" y="487">Interface</text>
  <text class="s" x="306" y="508">Streamlit, port 8502</text>
  <text class="f" x="306" y="530">app/interface.py</text>

  <rect class="boite code" x="550" y="330" width="140" height="350" rx="10"/>
  <text class="t" x="620" y="362" text-anchor="middle">API FastAPI</text>
  <text class="f" x="620" y="382" text-anchor="middle">app/api.py</text>
  <text class="s" x="620" y="402" text-anchor="middle">port 8000</text>
  <line x1="568" y1="418" x2="672" y2="418" stroke="#cbd5e1" stroke-width="1"/>
  <text class="f" x="620" y="440" text-anchor="middle">POST /ask</text>
  <text class="f" x="620" y="458" text-anchor="middle">GET /totaux</text>
  <text class="f" x="620" y="476" text-anchor="middle">GET /health</text>

  <rect class="boite code" x="740" y="330" width="210" height="100" rx="10"/>
  <text class="t" x="756" y="358">Recherche</text>
  <text class="s" x="756" y="380">filtre par client d'abord,</text>
  <text class="s" x="756" y="398">puis seuil de pertinence</text>
  <text class="f" x="756" y="418">app/recherche.py</text>

  <rect class="boite code" x="990" y="460" width="250" height="90" rx="10"/>
  <text class="t" x="1006" y="487">Totaux par fournisseur</text>
  <text class="s" x="1006" y="508">addition en code, sans modèle</text>
  <text class="f" x="1006" y="530">app/montants.py</text>

  <rect class="boite code" x="740" y="590" width="210" height="90" rx="10"/>
  <text class="t" x="756" y="617">Appel au modèle</text>
  <text class="s" x="756" y="638">consigne + passages balisés</text>
  <text class="f" x="756" y="660">app/llm.py</text>

  <text class="section ambre" x="1010" y="580">SERVICE EXTERNE</text>
  <rect class="boite externe" x="1010" y="590" width="230" height="90" rx="10"/>
  <text class="t" x="1026" y="617">Modèle de langage</text>
  <text class="s" x="1026" y="638">Groq ou Claude, par API</text>
  <text class="s" x="1026" y="656">reçoit les passages retenus</text>

  <!-- flèches du trajet d'une question -->
  <path class="lien" d="M200,490 L288,490"/>
  <path class="lien" d="M290,520 L202,520"/>
  <path class="lien" d="M460,490 L548,490"/>
  <path class="lien" d="M550,520 L462,520"/>
  <path class="lien" d="M690,380 L738,380"/>
  <path class="lien" d="M845,330 L845,222"/>
  <path class="lien" d="M690,505 L988,505"/>
  <text class="f" x="840" y="497" text-anchor="middle">GET /totaux</text>
  <path class="lien" d="M1115,460 L1115,222"/>
  <path class="lien" d="M690,635 L738,635"/>
  <path class="lien double" d="M952,635 L1008,635"/>

  <!-- pastilles numérotées sur le schéma -->
  <circle class="pastille" cx="245" cy="471" r="11"/><text class="pastille-txt" x="245" y="475">1</text>
  <circle class="pastille" cx="714" cy="360" r="11"/><text class="pastille-txt" x="714" y="364">2</text>
  <circle class="pastille" cx="714" cy="615" r="11"/><text class="pastille-txt" x="714" y="619">3</text>
  <circle class="pastille" cx="245" cy="540" r="11"/><text class="pastille-txt" x="245" y="544">4</text>

  <!-- légende du trajet -->
  <text class="section" x="40" y="590">LE TRAJET D'UNE QUESTION</text>
  <circle class="pastille" cx="51" cy="612" r="11"/><text class="pastille-txt" x="51" y="616">1</text>
  <text class="s" x="72" y="616">L'utilisateur choisit un client et pose sa question.</text>
  <circle class="pastille" cx="51" cy="638" r="11"/><text class="pastille-txt" x="51" y="642">2</text>
  <text class="s" x="72" y="642">On retrouve les passages les plus proches,</text>
  <text class="s" x="72" y="658">parmi les documents de ce client seulement.</text>
  <circle class="pastille" cx="51" cy="680" r="11"/><text class="pastille-txt" x="51" y="684">3</text>
  <text class="s" x="72" y="684">Le modèle rédige la réponse à partir de ces seuls passages.</text>
  <circle class="pastille" cx="51" cy="706" r="11"/><text class="pastille-txt" x="51" y="710">4</text>
  <text class="s" x="72" y="710">L'API renvoie la réponse et ses sources.</text>

  <!-- pied : légende des couleurs -->
  <rect class="boite donnee" x="40" y="741" width="14" height="14" rx="3"/>
  <text class="note" x="61" y="753">Données</text>
  <rect class="boite code" x="132" y="741" width="14" height="14" rx="3"/>
  <text class="note" x="153" y="753">Code du projet</text>
  <rect class="boite externe" x="258" y="741" width="14" height="14" rx="3"/>
  <text class="note" x="279" y="753">Service externe</text>
  <text class="note" x="1240" y="753" text-anchor="end">Docker : l'interface et l'API tournent dans deux conteneurs.</text>
</svg>
